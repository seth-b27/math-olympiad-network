<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>math-olympiad-plexus</title> -->
    <title>math-olympiad-network</title>
    <link rel="icon" type="image/x-icon" href="/favicon.svg">
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Newsreader:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

</head>

<body>
    <main id="container">
        <svg id="graph" aria-hidden="true" focusable="false"></svg>
    </main>

    <nav id="controls" aria-label="Graph controls">
        <button onclick="resetView()">Reset</button>
        <button onclick="toggleLabels()" id="labelsBtn" aria-pressed="false">Labels</button>
        <button onclick="filterByType()" id="filterBtn" aria-pressed="false">Filter</button>
    </nav>

    <aside id="stats" aria-label="Graph statistics">
        <div><span class="stat-value" id="node-count">0</span> nodes</div>
        <div><span class="stat-value" id="edge-count">0</span> edges</div>
    </aside>

    <aside id="legend" aria-label="Node type legend">
        <p>Node Types</p>
        <div class="legend-item">
            <div class="legend-dot" style="background: #1a1a1a;" aria-hidden="true"></div>
            <span>Contest</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #4a4a4a;" aria-hidden="true"></div>
            <span>Problem</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #7a7a7a;" aria-hidden="true"></div>
            <span>Field</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #aaaaaa;" aria-hidden="true"></div>
            <span>Subfield</span>
        </div>
    </aside>

    <section id="sidebar" aria-label="Node details" aria-live="polite">
        <div class="close" onclick="closeSidebar()" aria-label="Close panel"></div>
        <div id="sidebar-content"></div>
    </section>

    <script src="scripts.js"></script>
</body>
</html>
